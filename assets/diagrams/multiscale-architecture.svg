<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b5"/>
    </marker>
  </defs>
  <style>
    .node { fill: #33506c; stroke: #6f93b8; stroke-width: 1.5; }
    .lab  { fill: #eef4fa; font-size: 14px; text-anchor: middle; }
    .edge { stroke: #9aa7b5; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 6 4; }
    .elab { fill: #9aa7b5; font-size: 11px; text-anchor: middle; font-style: italic; }
  </style>

  <!-- main pipeline (left) -->
  <rect class="node" x="60"  y="16"  width="260" height="46" rx="8"/>
  <text class="lab" x="190" y="44">QTGA measurements</text>

  <rect class="node" x="60"  y="102" width="260" height="46" rx="8"/>
  <text class="lab" x="190" y="123">Gaussian virtual-</text>
  <text class="lab" x="190" y="140">species model</text>

  <rect class="node" x="60"  y="188" width="260" height="46" rx="8"/>
  <text class="lab" x="190" y="209">CTSP particle tracing</text>
  <text class="lab" x="190" y="226">&amp; view factors</text>

  <rect class="node" x="60"  y="288" width="260" height="46" rx="8"/>
  <text class="lab" x="190" y="309">System-scale</text>
  <text class="lab" x="190" y="326">deposition predictions</text>

  <!-- MD track (right) -->
  <rect class="node" x="452" y="102" width="248" height="46" rx="8"/>
  <text class="lab" x="576" y="123">LAMMPS interfacial</text>
  <text class="lab" x="576" y="140">simulations</text>

  <rect class="node" x="452" y="188" width="248" height="46" rx="8"/>
  <text class="lab" x="576" y="216">Resolved surface physics</text>

  <!-- solid edges -->
  <path class="edge" d="M190,62 L190,102"/>
  <path class="edge" d="M190,148 L190,188"/>
  <path class="edge" d="M190,234 L190,288"/>
  <path class="edge" d="M576,148 L576,188"/>

  <!-- dashed cross-scale coupling (planned) -->
  <path class="edge dash" d="M452,211 L322,211"/>
  <text class="elab" x="387" y="190">future reduced-order</text>
  <text class="elab" x="387" y="204">closures</text>
</svg>
